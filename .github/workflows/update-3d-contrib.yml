name: Update 3D Contribution Banner

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:15 America/Chicago (13:15 UTC; may shift with DST)
    - cron: "15 13 * * *"

permissions:
  contents: write

concurrency:
  group: profile-readme-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Update contribution banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-3d-banner.py --overwrite

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contrib-3d-banner.svg assets/contrib-3d-banner.png
          git diff --cached --quiet || git commit -m "chore: update 3d contribution banner"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
